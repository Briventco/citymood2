<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CityMood Newsroom reference: quick-publish-mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&amp;family=Source+Serif+4:opsz,wght@8..60,700&amp;display=swap">
<style>
body{margin:0}
a{color:#000000}
</style>
<div style="width: 390px; height: 1280px; box-sizing: border-box; background: #FFFFFF; color: #000000; font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column">

  <header style="background: #000000; color: #FFFFFF; display: flex; align-items: center; gap: 4px; padding: 6px 8px; flex: none">
    <a href="#" aria-label="Back to articles" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg></a>
    <div style="flex: 1">
      <div style="font-size: 17px; font-weight: 800">New story</div>
      <div style="font-size: 12px; color: #B8B8B2">Draft · saved just now</div>
    </div>
    <button type="button" style="height: 40px; padding: 0 14px; background: none; border: 1px solid #FFFFFF; color: #FFFFFF; font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 700">Save</button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 18px">

    <div>
      <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px">Photo</div>
      <div style="background: #F3F3EF; border: 2px dashed #8A8A84; aspect-ratio: 16 / 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.6" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        <div style="display: flex; gap: 8px">
          <button type="button" style="height: 44px; padding: 0 16px; background: #000000; color: #FFFFFF; border: none; font-family: 'Source Sans 3', sans-serif; font-size: 15px; font-weight: 700">Take photo</button>
          <button type="button" style="height: 44px; padding: 0 16px; background: #FFFFFF; color: #000000; border: 2px solid #000000; font-family: 'Source Sans 3', sans-serif; font-size: 15px; font-weight: 700">Choose</button>
        </div>
      </div>
      <div style="font-size: 13px; color: #5C5C58; margin-top: 6px">Photos are resized on upload to save data.</div>
    </div>

    <div>
      <label for="mh" style="display: block; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px">Headline</label>
      <textarea id="mh" rows="3" style="width: 100%; box-sizing: border-box; border: none; border-bottom: 2px solid #000000; padding: 4px 0 8px; font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; line-height: 1.15; font-weight: 700; resize: none">Tanker crash near Agbara slows Lagos-bound traffic</textarea>
    </div>

    <div>
      <label for="mcat" style="display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px">Category</label>
      <select id="mcat" style="width: 100%; height: 48px; border: 1px solid #8A8A84; padding: 0 10px; font-family: 'Source Sans 3', sans-serif; font-size: 16px; background: #FFFFFF"><option>Local News</option></select>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #000000; color: #FFFFFF">
      <div style="flex: 1"><div id="mbr" style="font-size: 16px; font-weight: 800">Breaking news</div><div style="font-size: 13px; color: #B8B8B2">Ticker for 6 hours after publishing</div></div>
      <button type="button" role="switch" aria-checked="true" aria-labelledby="mbr" style="flex: none; width: 56px; height: 32px; border: 2px solid #9AFF01; background: #9AFF01; padding: 3px; display: flex; justify-content: flex-end"><span aria-hidden="true" style="width: 22px; height: 22px; background: #000000; display: block"></span></button>
    </div>

    <div>
      <label for="mb" style="display: block; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px">Story</label>
      <textarea id="mb" rows="9" style="width: 100%; box-sizing: border-box; border: 1px solid #8A8A84; padding: 10px 12px; font-family: 'Source Sans 3', sans-serif; font-size: 17px; line-height: 1.5; resize: none">Emergency responders cleared an overturned tanker near the Agbara bridge this morning. Lagos-bound traffic is moving slowly. No injuries were reported at the scene.</textarea>
      <div style="font-size: 13px; color: #5C5C58; margin-top: 4px">Placeholder story for the prototype</div>
    </div>

    <details style="border-top: 1px solid #D9D9D4; border-bottom: 1px solid #D9D9D4">
      <summary style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; font-size: 16px; font-weight: 700; cursor: pointer; list-style: none">More details<span style="font-size: 14px; font-weight: 600; color: #5C5C58">Standfirst, tags, search</span></summary>
    </details>

    <section aria-labelledby="mchk" style="background: #F3F3EF; padding: 14px">
      <h2 id="mchk" style="margin: 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase">Before you publish</h2>
      <ul style="list-style: none; margin: 0; padding: 0; font-size: 15px">
        <li style="display: flex; align-items: center; gap: 10px; padding: 5px 0"><span aria-hidden="true" style="width: 18px; height: 18px; background: #9AFF01; outline: 1px solid #000000; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#000000" stroke-width="2.2"><path d="M2 6l3 3 5-6"></path></svg></span>Headline</li>
        <li style="display: flex; align-items: center; gap: 10px; padding: 5px 0; font-weight: 700"><span aria-hidden="true" style="width: 18px; height: 18px; border: 2px solid #000000; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">!</span>Add a photo, or publish without one</li>
      </ul>
    </section>
  </div>

  <div style="flex: none; display: flex; gap: 10px; padding: 12px 16px 20px; border-top: 2px solid #000000; background: #FFFFFF">
    <button type="button" style="flex: 1; height: 52px; background: #FFFFFF; border: 2px solid #000000; font-family: 'Source Sans 3', sans-serif; font-size: 16px; font-weight: 700">Preview</button>
    <button type="button" style="flex: 2; height: 52px; background: #9AFF01; border: 2px solid #000000; font-family: 'Source Sans 3', sans-serif; font-size: 16px; font-weight: 800">Publish</button>
  </div>
</div>
</body>
</html>
