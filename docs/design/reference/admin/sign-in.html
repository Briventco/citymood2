<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CityMood Newsroom reference: sign-in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,300&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#000000}
</style>
<div style="width: 100%; min-height: 860px; display: flex; flex-wrap: wrap; font-family: 'Source Sans 3', sans-serif; color: #000000; background: #FFFFFF">
  <div style="flex: 1 1 380px; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px; box-sizing: border-box; border-right: 8px solid #9AFF01">
    <img src="../../assets/citymood-logo.png" alt="CityMood" style="height: 180px; width: auto; display: block; align-self: flex-start; margin-left: -18px">
    <div>
      <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #9AFF01; margin-bottom: 12px">Newsroom</div>
      <div style="font-weight: 300; font-style: italic; font-size: 18px; letter-spacing: 0.42em; text-transform: uppercase">Window to Badagry</div>
    </div>
    <div style="font-size: 14px; color: #B8B8B2">For CityMood staff only. Readers can go to the <a href="#" style="color: #FFFFFF; font-weight: 700">homepage</a>.</div>
  </div>

  <main style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: 40px 24px; box-sizing: border-box">
    <form style="width: 100%; max-width: 400px">
      <h1 style="margin: 0 0 6px; font-family: 'Source Serif 4', Georgia, serif; font-size: 40px; line-height: 1.05; font-weight: 600">Sign in</h1>
      <p style="margin: 0 0 28px; font-size: 17px; color: #222222">Use the email your editor invited.</p>
      <label for="le" style="display: block; font-size: 15px; font-weight: 700; margin-bottom: 6px">Email</label>
      <input id="le" type="email" autocomplete="username" style="width: 100%; box-sizing: border-box; height: 48px; border: 2px solid #000000; padding: 0 14px; font-family: 'Source Sans 3', sans-serif; font-size: 17px; margin-bottom: 18px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px">
        <label for="lp" style="font-size: 15px; font-weight: 700">Password</label>
        <a href="#" style="font-size: 15px; font-weight: 600">Forgot password?</a>
      </div>
      <input id="lp" type="password" autocomplete="current-password" style="width: 100%; box-sizing: border-box; height: 48px; border: 2px solid #000000; padding: 0 14px; font-family: 'Source Sans 3', sans-serif; font-size: 17px; margin-bottom: 14px">
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; margin-bottom: 14px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #000000">Keep me signed in on this device</label>
      <button type="submit" style="width: 100%; height: 52px; background: #9AFF01; border: 2px solid #000000; font-family: 'Source Sans 3', sans-serif; font-size: 17px; font-weight: 800; cursor: pointer">Sign in</button>
      <p style="margin: 18px 0 0; font-size: 14px; color: #5C5C58">After 5 wrong attempts, sign-in pauses for 15 minutes.</p>
    </form>
  </main>
</div>
</body>
</html>
